services:
  check:
    build: .
    working_dir: /workspace
    init: true
    entrypoint: ['node', 'scripts/container-user.mjs']
    shm_size: 2gb
    environment:
      CI: '1'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - .:/checkout
    command: npm run ops -- check
